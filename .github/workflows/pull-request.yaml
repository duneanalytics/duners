name: Rust Lint, Clippy & Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Lint & Clippy
        run: cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings -W unused-crate-dependencies

      - name: Tests
        run: cargo test
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}

  doc-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust nightly
        # NOTE: dtolnay/rust-toolchain encodes the toolchain channel in the git
        # ref (e.g. @nightly, @stable, @1.XX.Y), so it is the documented
        # exception to SHA-pinning. Nightly is required here for
        # `cargo +nightly rustdoc -Z unstable-options --show-coverage`. Do not
        # replace this ref with a commit SHA.
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-docs
      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Doc coverage check
        run: bash scripts/check-doc-coverage.sh
